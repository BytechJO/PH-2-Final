<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Playhouse</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="../css/jquery-ui.min.css" />

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.css" />

    <style id="ui_style"></style>

    <link rel="stylesheet" href="../css/all.min.css" />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="stylesheet" href="../css/unit_styles.css" />

    <link rel="stylesheet" href="../css/activities.css" />

    <link rel="stylesheet" href="../css/audio.css" />

    <!-- Activity CSS -->
    <link rel="stylesheet" href="../css/look_write_prepositions.css" />

    <!-- jQuery -->
    <script src="../js/jquery-3.4.1.min.js" type="text/javascript"></script>

    <script src="../js/jquery-ui.min.js" type="text/javascript"></script>

    <script
      src="../js/bootstrap/bootstrap.bundle.min.js"
      type="text/javascript"
    ></script>

    <script
      src="../js/jquery.ui.touch-punch.min.js"
      type="text/javascript"
    ></script>

    <!-- Header and footer data -->
    <script src="../js/data/templateData.js" type="text/javascript"></script>

    <!-- Activity list -->
    <script src="../js/data/activityList.js" type="text/javascript"></script>

    <!-- Common renderer -->
    <script src="../js/build/jsonRender.js" type="text/javascript"></script>

    <!-- Activity data -->
    <script
      src="../js/data/look_write_prepositions_data.js"
      type="text/javascript"
    ></script>
  </head>

  <body>
    <!-- Side masks -->
    <div class="mask_parent">
      <div class="mask_left"></div>

      <div class="mask_right"></div>
    </div>

    <!-- Loader -->
    <div class="loading">
      <div class="loader"></div>
    </div>

    <!-- Header -->
    <header class="fixed-top"></header>

    <div class="mainContent">
      <!-- Feedback popup -->
      <div id="feedbackPopup" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div>
              <button
                type="button"
                class="close closeFeedback"
                data-dismiss="modal"
              >
                &times;
              </button>
            </div>

            <div class="modal-body">
              <video id="video_1" src="../videos/goodjob.mp4" preload></video>

              <video id="video_2" src="../videos/tryagain.mp4" preload></video>
            </div>
          </div>
        </div>
      </div>

      <!-- Main activity container -->
      <div class="container content_wrap activity_wrap">
        <!-- Page numbers -->
        <div class="fixed-top screen_numbers_wrap" style="z-index: 2"></div>

        <!-- Activity information buttons -->
        <div
          class="activity_buts d-none"
          data-buttons="ccss,link,tips,homework"
        >
          <div class="ccss_content" data-height="">L.1.1</div>

          <div class="link_content" data-height="">
            <a
              href="../../../ARC_1_1_SB/ARC_1_1_SB_U3/index.html"
              target="_blank"
            >
              Playhouse Reading Unit 3 – All Aboard!
            </a>
          </div>

          <div class="tips_content" data-height="">
            <span class="pop_title"> Grammar </span>

            <br />

            <span>
              Look at each picture and write the correct sentence using the
              words in the box.
            </span>
          </div>

          <div class="homework_content" data-height="">
            Have your child look at each picture and complete the sentence.
          </div>
        </div>

        <!-- Activity area -->
        <div
          class="activity_container activity_area mx-auto"
          data-activity="look_write_prepositions"
        ></div>
      </div>
    </div>

    <!-- Activity controls popup -->
    <div
      class="modal fade activityCtrlPanel"
      tabindex="-1"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div class="ctrlIcon"></div>

            <h4 class="modal-title"></h4>

            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>

          <div class="modal-body"></div>
        </div>
      </div>
    </div>

    <!-- Sub footer -->
    <div class="sub_footer">
      <div class="container sub_footer_buttons_wrap"></div>
    </div>

    <!-- Footer -->
    <footer class="fixed-bottom"></footer>

    <!-- Media list -->
    <script>
      var _mediaList = {
        image: [],

        audio: [],

        video: [],
      };
    </script>

    <!-- Template -->
    <script src="../js/build/template.js" type="text/javascript"></script>

    <!-- General functions -->
    <script src="../js/generalfunctions.js" type="text/javascript"></script>

    <!-- Activity build -->
    <script
      src="../js/build/look_write_prepositions_build.js"
      type="text/javascript"
    ></script>

    <!-- Activity logic -->
    <script
      src="../js/activity/look_write_prepositions.js"
      type="text/javascript"
    ></script>

    <!-- Activity controls -->
    <script src="../js/activities.js" type="text/javascript"></script>

    <!-- Audio -->
    <script src="../js/build/audio.js" type="text/javascript"></script>

    <script src="../js/build/radio_build.js" type="text/javascript"></script>

    <!-- Loader must be last -->
    <script src="../js/loading.js" type="text/javascript"></script>
  </body>
</html>
