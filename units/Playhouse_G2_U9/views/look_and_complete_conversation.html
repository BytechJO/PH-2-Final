    <div class="mask_parent">
      <div class="mask_left"></div>
      <div class="mask_right"></div>
    </div>

    <div class="loading">
      <div class="loader"></div>
    </div>

    <header class="fixed-top"></header>

    <div class="mainContent">
      <div id="feedbackPopup" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div>
              <button
                type="button"
                class="close closeFeedback"
                data-dismiss="modal"
              >
                &times;
              </button>
            </div>

            <div class="modal-body">
              <video id="video_1" src="../videos/goodjob.mp4" preload></video>

              <video id="video_2" src="../videos/tryagain.mp4" preload></video>
            </div>
          </div>
        </div>
      </div>

      <div class="container content_wrap activity_wrap">
        <div class="fixed-top screen_numbers_wrap" style="z-index: 2"></div>

        <div
          class="activity_buts d-none"
          data-buttons="ccss,link,tips,homework"
        >
          <div class="ccss_content">L.1.1</div>

          <div class="link_content"></div>

          <div class="tips_content">
            Look at each picture and complete the conversation.
          </div>

          <div class="homework_content">
            Complete the questions and answers.
          </div>
        </div>

        <div
          class="activity_container activity_area fill_in mx-auto"
          data-activity="fillin"
        ></div>
      </div>
    </div>

    <div
      class="modal fade activityCtrlPanel"
      tabindex="-1"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div class="ctrlIcon"></div>

            <h4 class="modal-title"></h4>

            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>

          <div class="modal-body"></div>
        </div>
      </div>
    </div>

      <div class="container sub_footer_buttons_wrap"></div>
    </div>
